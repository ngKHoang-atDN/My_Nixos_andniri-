$font = JetBrainsMono Nerd Font

general {
hide_cursor = true
grace = 0
ignore_empty_input = true
disable_loading_bar = true
}

auth {
fingerprint {
enabled = true
ready_message = Scan fingerprint to unlock
present_message = Scanning...
retry_delay = 250
}
}

animations {
enabled = true

```
bezier = linear, 1, 1, 0, 0

animation = fadeIn, 1, 5, linear
animation = fadeOut, 1, 5, linear
animation = inputFieldDots, 1, 2, linear
```

}

# ─────────────────────────────────────────────

# Wallpaper hiện tại

# ─────────────────────────────────────────────

background {
monitor =
path = screenshot

```
blur_passes = 3
blur_size = 8

noise = 0.015
contrast = 0.90
brightness = 0.82
vibrancy = 0.20
vibrancy_darkness = 0.0
```

}

# ─────────────────────────────────────────────

# Clock

# ─────────────────────────────────────────────

label {
monitor =

```
text = cmd[update:1000] echo "$(date '+%H:%M')"

color = rgb(c4a7e7)
font_size = 96
font_family = $font

position = 0, 170
halign = center
valign = center

shadow_passes = 3
shadow_size = 4
shadow_color = rgb(191724)
```

}

# ─────────────────────────────────────────────

# Date

# ─────────────────────────────────────────────

label {
monitor =

```
text = cmd[update:60000] echo "$(date '+%A, %d %B %Y')"

color = rgb(e0def4)
font_size = 20
font_family = $font

position = 0, 75
halign = center
valign = center
```

}

# ─────────────────────────────────────────────

# User

# ─────────────────────────────────────────────

label {
monitor =

```
text = $USER

color = rgb(ebbcba)
font_size = 22
font_family = $font

position = 0, -115
halign = center
valign = center
```

}

# ─────────────────────────────────────────────

# Fingerprint / Password

# ─────────────────────────────────────────────

input-field {
monitor =

```
size = 360, 64

outline_thickness = 2
rounding = 18

dots_size = 0.25
dots_spacing = 0.22
dots_center = true
dots_rounding = -1

outer_color = rgb(c4a7e7)
inner_color = rgba(25, 23, 36, 0.75)

font_color = rgb(e0def4)
font_family = $font
font_size = 18

fade_on_empty = false

placeholder_text = <i>Fingerprint or password</i>
fail_text = <i>$PAMFAIL $FPRINTFAIL</i>

check_color = rgb(9ccfd8)
fail_color = rgb(eb6f92)

position = 0, -205
halign = center
valign = center

shadow_passes = 3
shadow_size = 5
shadow_color = rgb(25, 23, 36)
```

}

# ─────────────────────────────────────────────

# Fingerprint status

# ─────────────────────────────────────────────

label {
monitor =

```
text = cmd[update:1000] echo "󰈷  Fingerprint ready"

color = rgb(9ccfd8)
font_size = 16
font_family = $font

position = 0, -285
halign = center
valign = center
```

}

# ─────────────────────────────────────────────

# Battery

# ─────────────────────────────────────────────

label {
monitor =

```
text = cmd[update:10000] sh -c 'BAT=$(ls /sys/class/power_supply/ | grep "^BAT" | head -n1); if [ -n "$BAT" ]; then echo "󰁹 $(cat /sys/class/power_supply/$BAT/capacity)%"; fi'

color = rgb(908caa)
font_size = 16
font_family = $font

position = 30, 30
halign = left
valign = bottom
```

}

# ─────────────────────────────────────────────

# Keyboard

# ─────────────────────────────────────────────

label {
monitor =

```
text = "󰌌"

color = rgb(908caa)
font_size = 18
font_family = $font

position = -30, 30
halign = right
valign = bottom
```

}

